# rules/default.yaml
watchdog:
  # WARN thresholds (suspicious → payment proceeds with friction)
  min_seconds_between_txns: 30
  min_scam_proximity_sec: 300
  max_txn_per_hour: 5
  normal_hours: [8, 22]
  network_min_linked: 5
  network_forward_max_sec: 90
   # Check 8: Geolocation
  geo_warn_km: 200
  geo_trip_km: 500
  # Check 9: Device
  device_warn_amount: 10000
  device_trip_amount: 50000
  # Check 10: MCC 
  # These are real ISO 18245 MCC codes: 5300=Grocery, 5411=Gas, 5812=Computer Software, 6051=Digital Goods, 6211=Telecom,
  # 6540=Securities, 7299=Other Business Services. Adjust to your domain
  expected_mccs: ["5300", "5411", "5499", "5812", "5815", "5999", "6051"]
  suspicious_mccs: ["6051", "6211", "6540", "7299"]

  # TRIP thresholds (confirmed threat → hard block)
  trip_seconds_between_txns: 20
  trip_scam_proximity_sec: 250
  trip_max_txn_per_hour: 6
  trip_normal_hours: [7, 23]
  trip_network_min_linked: 8
  trip_network_forward_max_sec: 60

dwell_min:
  open_app: 2
  select_contact: 3
  enter_amount: 5
  verify: 2
  confirm: 30

expected_sequence:
  - open_app
  - select_contact
  - enter_amount
  - verify
  - confirm

